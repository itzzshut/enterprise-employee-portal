# ---------------------------------------------------------------------------
# nginx configuration for the Angular SPA container.
#
# Three jobs: serve hashed static assets with aggressive caching, fall back to
# index.html so deep links work on refresh, and proxy /api to the API service.
# ---------------------------------------------------------------------------

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # --- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # --- Security headers --------------------------------------------------
    # The SPA loads scripts and styles from its own origin only; fonts come
    # from Google Fonts and the API is reached through the same origin via the
    # /api proxy below, so connect-src stays 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # --- API proxy ---------------------------------------------------------
    # `api` resolves on the compose / Kubernetes service network.
    location /api/ {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_read_timeout 60s;
        # Uploads go through this path too, so allow a little headroom over the
        # API's own 5MB limit.
        client_max_body_size 8m;
    }

    location /static/ {
        proxy_pass       http://api:4000;
        proxy_set_header Host $host;
    }

    location /api-docs {
        proxy_pass       http://api:4000;
        proxy_set_header Host $host;
    }

    # --- Static assets -----------------------------------------------------
    # Angular emits content-hashed filenames, so these can be cached forever.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # index.html must never be cached, or a deploy would leave clients loading
    # asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    -1;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
