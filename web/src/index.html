<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Employee Portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HR self-service portal — leave, timesheets, documents and the company directory." />
    <meta name="theme-color" content="#1b35b3" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface-muted text-slate-800 antialiased">
    <app-root>
      <!-- Shell skeleton rendered before Angular bootstraps, so the first paint
           is the app frame rather than a blank page. -->
      <div class="flex min-h-screen items-center justify-center">
        <div class="flex flex-col items-center gap-3">
          <div class="h-10 w-10 animate-spin rounded-full border-2 border-brand-200 border-t-brand-600"></div>
          <p class="text-sm text-slate-500">Loading the employee portal…</p>
        </div>
      </div>
    </app-root>
  </body>
</html>
